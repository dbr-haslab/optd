[package]
name = "optd-datafusion"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
datafusion = { workspace = true }
datafusion-sql = { workspace = true }
tracing = { workspace = true, features = ["log"] }
optd-core = { path = "../../optd/core", version = "0.1" }
optd-catalog = { path = "../../optd/catalog", version = "0.1" }
itertools = { workspace = true }
async-trait = { workspace = true }
snafu = { workspace = true }
serde_json = "1"
datafusion-federation = {  version = "0.4.14", features = ["sql"] }
datafusion-table-providers = { version = "0.10", features = ["sqlite-federation"] }
tokio = { workspace = true }
secrecy = "0.10"

[dev-dependencies]
tempfile = "3.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
